# Default server port (for nn1)
server.port=${SERVER_PORT:9001}

# Application identity
spring.application.name=namenode

# Node identifier (nn1, nn2, nn3)
node.id=${NODE_ID:nn1}

# NameNode configuration
namenode.id=${NODE_ID:nn1}
namenode.host=http://localhost:${SERVER_PORT:9001}
namenode.peers=http://localhost:9002,http://localhost:9003

# File upload limits
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# Optional in-memory DB console
spring.h2.console.enabled=true

# Logging pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID}){magenta} --- [%clr(${node.id}){cyan}] %clr(%m%n){faint}
