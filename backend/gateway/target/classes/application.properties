# ===============================
# Gateway Server Configuration
# ===============================

# Default server port
server.port=${SERVER_PORT:8001}

# Application identity
spring.application.name=gateway

# Node identifier
node.id=${NODE_ID:gw1}

# NameNode cluster endpoints
namenode.endpoints=${NAMENODE_ENDPOINTS:http://localhost:9001,http://localhost:9002,http://localhost:9003}

# File upload limits
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# Logging pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID}){magenta} --- [%clr(${node.id}){cyan}] %clr(%m%n){faint}

# Logging levels
logging.level.com.dfs.gateway=DEBUG
logging.level.org.springframework.web=INFO