# ===============================
# DataNode Server Configuration
# ===============================

# Default server port (for REST API)
server.port=${SERVER_PORT:9101}

# Application identity
spring.application.name=datanode

# Node identifier (dn1, dn2, dn3)
node.id=${NODE_ID:dn1}

# DataNode configuration
datanode.id=${NODE_ID:dn1}
datanode.blockPort=${DATANODE_BLOCK_PORT:10001}
datanode.dataDir=${DATANODE_DATA_DIR:./data/dn1}

# NameNode endpoints for heartbeat
namenode.endpoints=${NAMENODE_ENDPOINTS:http://localhost:9001,http://localhost:9002,http://localhost:9003}

# Logging pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID}){magenta} --- [%clr(${node.id}){cyan}] %clr(%m%n){faint}

# Logging levels
logging.level.com.dfs.datanode=DEBUG
logging.level.org.springframework.web=INFO